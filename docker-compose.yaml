# Docker Compose version removed as it's obsolete

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    container_name: api
    entrypoint: ["/scripts/entrypoint_project.sh", "python", "src/api_server.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PYTHONPATH: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  kudago_worker:
    build:
      context: ./backend
    container_name: kudago_worker
    entrypoint: ["/scripts/entrypoint_project.sh", "python", "src/workers/kudago_worker.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PYTHONPATH: .
    depends_on:
      - postgres

  notification_worker:
    build:
      context: ./backend
    container_name: notification_worker
    entrypoint: ["/scripts/entrypoint_project.sh", "python", "src/workers/notification_worker.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PYTHONPATH: .
    depends_on:
      - postgres

  alembic:
    build:
      context: ./backend
    container_name: alembic
    entrypoint: ["/scripts/entrypoint_alembic.sh"]
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notification_db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/notification_db
      PYTHONPATH: .
    depends_on:
      - postgres
    volumes:
      - ./backend/src/repository/migrations:/usr/backend/src/repository/migrations

volumes:
  postgres_data:
